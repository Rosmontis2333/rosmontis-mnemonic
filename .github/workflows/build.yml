name: Native build and tests
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Allow secure test memory on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: sudo prlimit --pid $$ --memlock=unlimited:unlimited && cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --config Release && ctest --test-dir build -C Release --output-on-failure
      - name: Native build and tests
        if: runner.os != 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - if: runner.os != 'Linux'
        run: cmake --build build --config Release
      - if: runner.os != 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: rosmontis-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/rosmontis-mnemonic
            build/Release/rosmontis-mnemonic.exe
